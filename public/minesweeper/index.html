<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Defuser — Cyberpunk Minesweeper</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Terminal Header -->
        <header>
            <h1 class="neon-text">GRID DEFUSER</h1>
            <p class="subtitle">Secure The Network Matrix</p>
        </header>

        <!-- Stats Bar -->
        <div class="controls-panel">
            <div class="meta-info">
                <div class="status-indicator">
                    <span class="label">NODES:</span>
                    <span id="mine-count" class="neon-stat">10</span>
                </div>
                <div class="timer-box">
                    <span id="timer" class="neon-timer">00:00</span>
                </div>
            </div>
            <button id="reset-btn" class="btn btn-primary">REBOOT</button>
        </div>

        <!-- Interactive Minesweeper Canvas Layout -->
        <div class="game-wrapper">
            <div id="mines-grid" class="mines-grid"></div>
        </div>

        <!-- Instruction Rules for Users -->
        <div class="terminal-footer">
            <p>// CLICK TO SCAN NODE. SHIFT+CLICK TO MARK MALWARE (FLAG).</p>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
