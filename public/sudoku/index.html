<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Sudoku — Portfolio Edition</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<!-- Default theme state set to emerald -->
<body data-theme="emerald">
    <div class="container">
        <!-- Brand Header -->
        <header>
            <h1 class="neon-text">SUDOKU</h1>
          
        </header>

        <!-- Top Controls Panel -->
        <div class="controls-panel">
            <div class="control-row">
                <div class="control-group">
                    <label for="theme-select">THEME:</label>
                    <select id="theme-select">
                        <option value="emerald">Neon Emerald</option>
                        <option value="amethyst">Cyber Amethyst</option>
                        <option value="frost">Arctic Frost</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="difficulty">LEVEL:</label>
                    <select id="difficulty">
                        <option value="easy">EASY (STRICT)</option>
                        <option value="medium" selected>MEDIUM (CHALLENGE)</option>
                        <option value="hard">HARDCORE (EXPERT)</option>
                    </select>
                </div>
            </div>
            
            <div class="status-row">
                <div class="timer-box">
                    <span id="timer" class="neon-timer">00:00</span>
                </div>
                <button id="new-game-btn" class="btn btn-primary">INITIALIZE</button>
            </div>
        </div>

        <!-- Main Interactive Sudoku Board -->
        <div class="game-wrapper">
            <div id="sudoku-board" class="sudoku-board"></div>
        </div>

        <!-- Action Input Controller Pad -->
        <div class="number-pad">
            <button class="pad-btn" data-num="1">1</button>
            <button class="pad-btn" data-num="2">2</button>
            <button class="pad-btn" data-num="3">3</button>
            <button class="pad-btn" data-num="4">4</button>
            <button class="pad-btn" data-num="5">5</button>
            <button class="pad-btn" data-num="6">6</button>
            <button class="pad-btn" data-num="7">7</button>
            <button class="pad-btn" data-num="8">8</button>
            <button class="pad-btn" data-num="9">9</button>
            <button class="pad-btn delete-btn" data-num="erase">✖</button>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
