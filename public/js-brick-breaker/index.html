<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Brick Breaker | Portfolio Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h2>BRICK BREAKER</h2>
            <div class="stats">
                <div class="stat-box">LEVEL: <span id="level">1</span></div>
                <div class="stat-box">SCORE: <span id="score">0</span></div>
                <div class="stat-box">LIVES: <span id="lives">3</span></div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="500" height="350"></canvas>
            
            <!-- Screen Overlays -->
            <div id="overlay" class="overlay">
                <h1 id="overlayTitle">BRICK BREAKER</h1>
                <p id="overlayText">Test your reflexes. Clear all levels!</p>
                <button id="actionBtn">START GAME</button>
            </div>
        </div>
        
        <p class="controls-hint">Use ◄ and ► Arrow Keys or Mouse to Move</p>
    </div>
    <script src="game.js"></script>
</body>
</html>
