<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Void — Ultimate Animation & Audio Showcase</title>
    <link rel="stylesheet" href="style2.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- HUD Panel -->
        <div id="hud">
            <div class="hud-item">SCORE: <span id="score-val">0000</span></div>
            <div class="hud-item">BEST: <span id="high-val">0000</span></div>
        </div>

        <!-- Interactive Menu Overlay -->
        <div id="menu-overlay" class="overlay">
            <h1 class="neon-title">NEON VOID</h1>
            <p class="neon-subtitle">SYNTH AUDIO & FLUID CANVAS ENGINE</p>
            <button id="start-btn" class="cyber-btn">LAUNCH MATRIX DRIVE</button>
        </div>

        <!-- Game Canvas Frame -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="script2.js" defer></script>
</body>
</html>
